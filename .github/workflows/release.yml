name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Asset (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            bin: mini_sql
            archive_ext: tar.gz
          - os: macos-latest
            target: macos-arm64
            bin: mini_sql
            archive_ext: tar.gz
          - os: windows-latest
            target: windows-x86_64
            bin: mini_sql.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            zip

      - name: Build Optimized Release Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          make clean
          make all CFLAGS="-Wall -Wextra -O3 -std=c99 -DNDEBUG"

      - name: Build Optimized Release Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          make clean
          make all CC=gcc CFLAGS="-Wall -Wextra -O3 -std=c99 -DNDEBUG"

      - name: Package Archive (Linux & macOS)
        if: matrix.os != 'windows-latest'
        run: |
          TAG_NAME="${{ github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="latest"
          ARCHIVE_NAME="minisql-${TAG_NAME}-${{ matrix.target }}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" ${{ matrix.bin }} README.md LICENSE
          echo "ARCHIVE_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Package Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="latest"
          ARCHIVE_NAME="minisql-${TAG_NAME}-${{ matrix.target }}.zip"
          zip -9 "${ARCHIVE_NAME}" ${{ matrix.bin }} README.md LICENSE
          echo "ARCHIVE_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 3

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
